apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ecommerce
data:
  # Application Configuration
  APP_NAME: "E-Commerce Platform"
  APP_VERSION: "1.0.0"
  NODE_ENV: "production"
  
  # Database Configuration
  DB_HOST: "mongodb-service"
  DB_PORT: "27017"
  DB_NAME: "ecommerce"
  
  # Backend Configuration
  BACKEND_HOST: "backend-service"
  BACKEND_PORT: "3000"
  API_TIMEOUT: "30000"
  
  # Feature Flags
  ENABLE_CACHE: "true"
  ENABLE_LOGGING: "true"
  LOG_LEVEL: "info"
