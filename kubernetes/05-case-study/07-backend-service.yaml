apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ecommerce
  labels:
    app: backend
    tier: application
spec:
  type: ClusterIP  # Internal service for frontend to access
  selector:
    app: backend
    tier: application
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  sessionAffinity: None  # Round-robin load balancing across backend pods
