apiVersion: v1
kind: Service
metadata:
  name: nginx-loadbalancer-service
  labels:
    app: nginx
spec:
  type: LoadBalancer  # Exposes the service externally using a cloud provider's load balancer
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  sessionAffinity: ClientIP  # Maintain session affinity based on client IP
