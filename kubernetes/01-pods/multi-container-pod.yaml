apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
  labels:
    app: multi-app
spec:
  containers:
  - name: nginx-container
    image: nginx:latest
    ports:
    - containerPort: 80
    volumeMounts:
    - name: shared-data
      mountPath: /usr/share/nginx/html
  
  - name: debian-container
    image: debian:latest
    command: ["/bin/sh"]
    args: ["-c", "while true; do echo '<html><body><h1>Hello from Kubernetes!</h1><p>Updated at: $(date)</p></body></html>' > /data/index.html; sleep 10; done"]
    volumeMounts:
    - name: shared-data
      mountPath: /data
  
  volumes:
  - name: shared-data
    emptyDir: {}
