services:
  db:
    image: postgres:16-alpine
    container_name: lab08-db
    environment:
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: labpass
      POSTGRES_DB: labdb
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - lab08-net
    ports:
      - "5432:5432"

  web:
    build: ./app
    container_name: lab08-web
    depends_on:
      - db
    ports:
      - "3000:3000"
    networks:
      - lab08-net

volumes:
  db_data:

networks:
  lab08-net:
    driver: bridge
